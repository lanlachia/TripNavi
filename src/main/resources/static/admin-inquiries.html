<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TripNavi 관리자 · 문의함</title><style>body{margin:0;background:#f7f5ff;color:#2c2440;font:15px system-ui,sans-serif}main{max-width:760px;margin:36px auto;padding:0 16px}h1{color:#6d28d9}button{background:#7c3aed;border:0;border-radius:12px;padding:12px 18px;color:white;font-weight:bold;cursor:pointer}.item{background:white;padding:20px;margin:14px 0;border-radius:18px;box-shadow:0 2px 12px #e8e2f2}.meta{font-size:12px;color:#746c81}.msg{white-space:pre-wrap;overflow-wrap:anywhere}#status{margin:16px 0}</style></head><body><main><h1>TripNavi · 관리자 문의함</h1><p>관리자 계정으로 TripNavi에 로그인한 브라우저에서만 조회할 수 있습니다.</p><button onclick="load()">문의 새로고침</button><div id="status" role="status"></div><div id="list"></div></main><script>async function load(){const status=document.getElementById('status'),list=document.getElementById('list');list.replaceChildren();status.textContent='문의 불러오는 중…';try{const r=await fetch('/api/inquiries/admin');const data=await r.json();if(!r.ok)throw Error(data.message||'조회 실패');status.textContent='총 '+data.length+'건';for(const q of data){const box=document.createElement('article');box.className='item';const title=document.createElement('h3');title.textContent=q.title;const meta=document.createElement('p');meta.className='meta';meta.textContent=q.author+' · '+q.email+' · '+q.createdAt.replace('T',' ');const msg=document.createElement('p');msg.className='msg';msg.textContent=q.message;box.append(title,meta,msg);list.append(box)}}catch(e){status.textContent=e.message}}load();</script></body></html>
